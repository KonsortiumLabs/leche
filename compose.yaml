services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      SITE_URL: ${SITE_URL:?Set SITE_URL to your confirmed HTTPS origin}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - leche-data:/app/data
volumes:
  leche-data:
